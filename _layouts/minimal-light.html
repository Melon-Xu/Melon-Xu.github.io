<!doctype html>
<!-- Local adaptation of Minimal Light (CC0), upstream 1ea07f39518ac44644406380c83da6f89037c4fc. -->
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.home %}{{ site.title }} | Ph.D. Candidate, Stony Brook University{% else %}{{ page.title }} | {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title }}{% unless page.home %} — {{ page.title }}{% endunless %}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ site.data.profile.avatar | absolute_url }}">
  <meta property="og:image:alt" content="Meilong Xu">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#174c65">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</head>
<body class="{% if page.home %}home{% else %}inner-page{% endif %}">
<a class="skip-link" href="#main">Skip to content</a>
<div class="wrapper">
  <aside class="sidebar" aria-label="Profile and experience">
    {% include light-profile.html %}
    {% include light-experience.html %}
  </aside>
  <div class="reading-column">
    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}#research">Research</a>
      <a href="{% if page.home %}#publications{% else %}{{ '/publications/' | relative_url }}{% endif %}">Publications</a>
      <a href="{% unless page.home %}{{ "/" | relative_url }}{% endunless %}#experience">Experience</a>
      <a href="{{ '/' | relative_url }}#service">Service</a>
    </nav>
    <main id="main" tabindex="-1">{{ content }}</main>
    <footer class="site-footer"><span>© {{ site.time | date: '%Y' }} {{ site.title }}</span><span>Jekyll · <a href="https://github.com/yaoyao-liu/minimal-light">Minimal Light</a></span></footer>
  </div>
</div>
</body>
</html>
