title: Meilong Xu
name: Meilong Xu
url: https://melon-xu.github.io
baseurl: ""
lang: en-US
description: "Meilong Xu is a Computer Science Ph.D. Candidate at Stony Brook University researching multimodal foundation models, generative AI, and structure-aware learning."
repository: Melon-Xu/Melon-Xu.github.io
markdown: kramdown
highlighter: rouge
permalink: pretty
timezone: America/New_York
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
# Old Academic Pages sources remain recoverable but are not part of the new site.
exclude:
  - _pages
  - _posts
  - _drafts
  - _publications
  - _portfolio
  - _talks
  - _teaching
  - docs
  - licenses
  - scripts
  - local
  - vendor
  - node_modules
  - .bundle
  - .github
  - .DS_Store
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - markdown_generator
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - assets/css
  - assets/js
  - assets/fonts
  - assets/webfonts
  - images/manifest.json
  - images/browserconfig.xml
  - "*Codex_Prompt*"
  - "*.log"
