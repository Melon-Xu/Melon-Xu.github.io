about:
- I am a final-year Computer Science Ph.D. Candidate at Stony Brook University, advised by <a href="https://chaochen.github.io/">Prof.
  Chao Chen</a> and working closely with <a href="https://huxiaoling.github.io/">Dr. Xiaoling Hu</a>. My research
  connects multimodal foundation models, generative modeling, and structure-aware learning. I develop methods that
  help models understand complex visual structures, adapt to new tasks, and produce more reliable outputs.
- My recent work explores vision-language model post-training through supervised fine-tuning and reinforcement learning,
  alongside topology-guided diffusion models and computational pathology. At Amazon Prime Video, I work on physics-grounded
  video generation; previously, at TikTok, I worked on multimodal model training and video understanding. Before
  my Ph.D., I received my B.Eng. from Wuhan University, where I worked with Prof. Jiayi Ma on image fusion.
opportunity: I expect to graduate in May 2027 and am seeking full-time Research Scientist, Applied Scientist, and
  Machine Learning Engineer roles. If you know of a suitable opportunity or would like to collaborate, please
